name: tajweed_quiz
description: إتقان — اختبار التجويد وتسميع القرآن برواية حفص، مع تصحيح فوري وشرح مصور.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.1
  introduction_screen: ^3.1.14
  shimmer: ^3.0.0
  bot_toast: ^4.1.3
  awesome_dialog: ^3.2.1
  smooth_page_indicator: ^1.2.0+3
  lottie: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0B6E4F"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/lottie/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
