name: tajweed_quiz
description: تطبيق اختبار التجويد ومخارج الحروف برواية حفص بن عاصم - يعمل دون اتصال ومعه ميزات عند الاتصال.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # لتحسين عرض الآيات يمكنك إضافة خط قرآني (مثل Amiri Quran) داخل assets/fonts
  # ثم فك التعليق عن الأسطر التالية وتعيين fontFamily في lib/widgets/ayah_card.dart
  # fonts:
  #   - family: AmiriQuran
  #     fonts:
  #       - asset: assets/fonts/AmiriQuran-Regular.ttf
