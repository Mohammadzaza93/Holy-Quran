name: CI

on:
  pull_request:
  push:
    branches: [main, tajweed-quiz-app]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # المجلدات android/ و web/ موجودة مسبقاً؛ هذا يضمن اكتمال الملفات المولّدة فقط
      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
