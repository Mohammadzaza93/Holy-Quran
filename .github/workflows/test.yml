name: Test & Analyze
on:
  push:
    branches: [tajweed-quiz-app, main]
  pull_request:
    branches: [tajweed-quiz-app, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
